<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="cakephp-menu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8545B"/>
      <stop offset="1" stop-color="#C4313A"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <g filter="url(#s)">
    <!-- top row -->
    <circle cx="36" cy="40" r="5.5" fill="#fff" opacity="0.92"/>
    <rect x="50" y="35.5" width="46" height="9" rx="4.5" fill="#fff" opacity="0.92"/>
    <!-- active row: highlighted pill -->
    <rect x="20" y="55" width="88" height="18" rx="9" fill="#fff" opacity="0.28"/>
    <circle cx="36" cy="64" r="5.5" fill="#fff"/>
    <rect x="50" y="59.5" width="46" height="9" rx="4.5" fill="#fff"/>
    <!-- nested child row (indented) -->
    <circle cx="50" cy="90" r="4.5" fill="#fff" opacity="0.78"/>
    <rect x="62" y="86" width="34" height="8" rx="4" fill="#fff" opacity="0.78"/>
  </g>
</svg>
